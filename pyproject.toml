[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pigbot"
authors = [
    {name = "Christian Boin"},
]
version = "0.2.1"
description = "discord bot with some fun features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "mcstatus",
    "py-cord[voice]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "requests",
    "songbirdcore",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
exclude = ["junit"]
